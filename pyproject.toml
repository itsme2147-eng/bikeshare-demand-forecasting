[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bikeshare"
version = "0.1.0"
description = "Day-ahead hourly demand forecasting for a bike-share system: cleaning, leakage-safe features, metrics"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "lightgbm", "statsmodels"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
